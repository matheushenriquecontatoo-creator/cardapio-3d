<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Cozinha & Mesas - Mesa360</title>

<style>
:root {
  --bg-dark: #0f1015;
  --card-bg: #181920;
  --card-border: rgba(255, 255, 255, 0.08);
  --primary: #f59e0b;
  --primary-hover: #d97706;
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --status-pendente: #f59e0b;
  --status-preparo: #8b5cf6;
  --status-pronto: #10b981;
}

* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg-dark); color: var(--text-main); padding: 24px; }

header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); flex-wrap:wrap; gap:16px; }
header h1 { font-size: 24px; font-weight: 800; color: #fff; display:flex; align-items:center; gap:10px; }
header h1 span { color: var(--primary); }

.acoes-topo { display:flex; gap:10px; }
.btn-top { background: #252836; color: #fff; border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; font-size: 13px; display:inline-flex; align-items:center; gap:6px; }
.btn-top:hover { background: #32364a; }
.btn-limpar { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

.grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

.card-pedido { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; position: relative; animation: popIn 0.3s ease; }
.card-pedido.pendente { border-left: 6px solid var(--status-pendente); }
.card-pedido.preparo { border-left: 6px solid var(--status-preparo); }
.card-pedido.pronto { border-left: 6px solid var(--status-pronto); }

@keyframes popIn { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }

.topo-card { display: flex; justify-content: space-between; align-items: center; }
.mesa-tag { background: rgba(245, 158, 11, 0.15); color: var(--primary); padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 14px; border: 1px solid rgba(245, 158, 11, 0.3); }
.hora-tag { font-size: 12px; color: var(--text-muted); font-weight: 600; }

.cliente-nome { font-size: 15px; font-weight: 700; color: #fff; }

.lista-itens { list-style: none; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); padding: 12px 0; }
.item-linha { display: flex; justify-content: space-between; font-size: 13px; }
.item-qtd { font-weight: 800; color: var(--primary); margin-right: 6px; }

.rodape-card { display: flex; justify-content: space-between; align-items: center; }
.total-valor { font-size: 18px; font-weight: 800; color: #fff; }
.pagto-tag { font-size: 11px; background: #252836; padding: 4px 8px; border-radius: 6px; color: var(--text-muted); font-weight: 600; }

.botoes-estado { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.btn-status { padding: 10px; border: none; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; text-align: center; }
.btn-preparo { background: var(--status-preparo); color: #fff; }
.btn-pronto { background: var(--status-pronto); color: #000; }
.btn-concluir { background: #252836; color: var(--text-muted); grid-column: span 2; }

.sem-pedidos { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 16px; border: 1px dashed var(--card-border); }
</style>
</head>
<body>

<header>
  <h1>🍽️ Painel de Chamadas <span>Mesa360</span></h1>
  <div class="acoes-topo">
    <a href="index.html" class="btn-top">📖 Ver Cardápio</a>
    <a href="admin.html" class="btn-top">📊 Dashboard Admin</a>
    <button class="btn-top btn-limpar" onclick="limparHistorico()">🗑️ Limpar Pedidos</button>
  </div>
</header>

<div class="grid-pedidos" id="gridPedidosMesas">
  <!-- Pedidos injetados automaticamente via JS -->
</div>

<script>
let totalPedidosAnterior = 0;

function carregarPedidosMesas() {
  const container = document.getElementById('gridPedidosMesas');
  const dados = JSON.parse(localStorage.getItem('pedidos_mesas') || '[]');

  // Tocar som se entrar um novo pedido
  if (dados.length > totalPedidosAnterior && totalPedidosAnterior !== 0) {
    tocarSomBip();
  }
  totalPedidosAnterior = dados.length;

  if (dados.length === 0) {
    container.innerHTML = `
      <div class="sem-pedidos">
        <h3>Nenhum pedido de mesa no momento</h3>
        <p style="font-size:13px; margin-top:6px;">Quando os clientes realizarem pedidos nas mesas pelo cardápio digital, eles aparecerão aqui em tempo real.</p>
      </div>`;
    return;
  }

  container.innerHTML = dados.map(p => `
    <div class="card-pedido ${p.status || 'pendente'}">
      <div class="topo-card">
        <span class="mesa-tag">${p.mesa}</span>
        <span class="hora-tag">⏱️ ${p.hora}</span>
      </div>

      <div class="cliente-nome">👤 ${p.nome}</div>

      <ul class="lista-itens">
        ${p.itens.map(i => `
          <li class="item-linha">
            <span><span class="item-qtd">${i.quantidade}x</span>${i.nome}</span>
            <strong>${(i.preco * i.quantidade).toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</strong>
          </li>
        `).join('')}
      </ul>

      <div class="rodape-card">
        <div>
          <span class="pagto-tag">${p.pagamentoTexto || '⚡ PIX'}</span>
        </div>
        <div class="total-valor">${p.total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</div>
      </div>

      <div class="botoes-estado">
        ${p.status !== 'preparo' && p.status !== 'pronto' ? `<button class="btn-status btn-preparo" onclick="alterarStatus('${p.id}', 'preparo')">🔥 Em Preparo</button>` : ''}
        ${p.status !== 'pronto' ? `<button class="btn-status btn-pronto" onclick="alterarStatus('${p.id}', 'pronto')">✅ Marcar Pronto</button>` : ''}
        <button class="btn-status btn-concluir" onclick="removerPedido('${p.id}')">🏁 Finalizar / Entregue</button>
      </div>
    </div>
  `).join('');
}

function alterarStatus(id, novoStatus) {
  let dados = JSON.parse(localStorage.getItem('pedidos_mesas') || '[]');
  const p = dados.find(i => i.id == id);
  if (p) {
    p.status = novoStatus;
    localStorage.setItem('pedidos_mesas', JSON.stringify(dados));
    carregarPedidosMesas();
  }
}

function removerPedido(id) {
  let dados = JSON.parse(localStorage.getItem('pedidos_mesas') || '[]');
  dados = dados.filter(i => i.id != id);
  localStorage.setItem('pedidos_mesas', JSON.stringify(dados));
  carregarPedidosMesas();
}

function limparHistorico() {
  if (confirm('Deseja apagar todos os pedidos da tela?')) {
    localStorage.removeItem('pedidos_mesas');
    carregarPedidosMesas();
  }
}

function tocarSomBip() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e){}
}

// Atualização automática a cada 3 segundos
setInterval(carregarPedidosMesas, 3000);
carregarPedidosMesas();
</script>
</body>
</html>
